name: 构建 iOS IPA

# 手动触发：GitHub → Actions → 构建 iOS IPA → Run workflow
# 或推送 tag（ios-*）自动构建并发布到 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: 安装依赖
        run: flutter pub get

      # 未签名构建：不需要开发者证书即可产出 IPA
      # （用爱思/AltStore 等工具安装时需自行签名；有开发者账号可改用导出描述文件的方式）
      - name: 构建 iOS（未签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          cd ../../..
          zip -qry classroom-english-unsigned.ipa build/ios/iphoneos/Payload
          ls -lh classroom-english-unsigned.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: classroom-english-ios-ipa
          path: classroom-english-unsigned.ipa
          retention-days: 3

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: classroom-english-unsigned.ipa
          name: iOS 未签名安装包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
