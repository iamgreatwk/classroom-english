name: 构建 iOS IPA

# 手动触发：GitHub → Actions → 构建 iOS IPA → Run workflow
#
# 产物只发布到 GitHub Release（tag: ios-latest，每次覆盖），
# 不使用 actions/upload-artifact —— Release 附件不占用 Actions 存储配额。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: 安装依赖
        run: flutter pub get

      # 未签名构建：不需要开发者证书即可产出 IPA
      # （用爱思/AltStore 等工具安装时需自行签名）
      - name: 构建 iOS（未签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qry ../../../classroom-english-unsigned.ipa Payload
          cd ../../..
          ls -lh classroom-english-unsigned.ipa

      # 每次覆盖同一个 Release，避免历史附件堆积
      - name: 清理旧的 ios-latest 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ios-latest --yes --cleanup-tag || true

      - name: 发布到 Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: iOS 未签名安装包
          body: |
            由 GitHub Actions 自动构建（未签名，需自行签名后安装）。
            构建时间：${{ github.run_id }}
          files: classroom-english-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出下载链接
        run: |
          echo "### iOS 安装包已发布 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "下载地址：${{ steps.release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "未签名 IPA，需用爱思助手 / AltStore 等工具签名后安装。" >> $GITHUB_STEP_SUMMARY
